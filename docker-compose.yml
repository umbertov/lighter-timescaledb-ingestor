services:
  db:
    image: timescale/timescaledb:latest-pg18
    restart: unless-stopped
    mem_limit: 24g
    shm_size: 1gb
    command:
      - postgres
      - -c
      - timezone=UTC
    volumes:
      - timescaledb_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      TS_TUNE_MEMORY: 24GB
      TS_TUNE_MAX_CONNS: 50
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  ingestor:
    image: ${INGESTOR_IMAGE:?Set INGESTOR_IMAGE}
    restart: unless-stopped
    profiles: ["ingestor"]
    environment:
      DATABASE_URL: ${INGESTOR_DATABASE_URL:?Set INGESTOR_DATABASE_URL}
      LIGHTER_API_URL: ${LIGHTER_API_URL:?Set LIGHTER_API_URL}
      LIGHTER_WS_URL: ${LIGHTER_WS_URL:?Set LIGHTER_WS_URL}
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy

volumes:
  timescaledb_data:
