services:

  db:
    image: timescale/timescaledb:latest-pg17
    restart: always
    shm_size: 128mb
    volumes:
      - ./postgres_volume:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: local-development-only
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: lighter_data
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lighter_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestor:
    image: lighter-timescaledb-ingestor:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:local-development-only@db:5432/lighter_data
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
  dashboard:
    image: grafana/grafana-oss
    restart: always
    ports:
      - 3001:3000
    volumes:
      - grafana_storage:/var/lib/grafana
volumes:
  grafana_storage:
